name: Android Emulator Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Install and launch on emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            git zip unzip openssl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Patch Buildozer manifest-argument quoting
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          import buildozer.targets.android as target

          path = Path(target.__file__)
          text = path.read_text(encoding="utf-8")
          text, escapes = re.subn(
              r"\.replace\('\"', '\\\\\"'\)", "", text
          )
          text, quoting = re.subn(
              r"--extra-manifest-application-arguments=\"\{\}\"",
              "--extra-manifest-application-arguments={}",
              text,
          )
          assert escapes == 1, f"quoting escape patch failed: {escapes}"
          assert quoting == 1, f"argument quoting patch failed: {quoting}"
          path.write_text(text, encoding="utf-8")
          print(f"patched {path}")
          PY

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile_app/.buildozer
          key: buildozer-smoke-${{ runner.os }}-p4a-v2024.01.21-v1-${{ hashFiles('mobile_app/buildozer.spec') }}
          restore-keys: |
            buildozer-smoke-${{ runner.os }}-p4a-v2024.01.21-v1-
            buildozer-${{ runner.os }}-p4a-v2024.01.21-v2-

      - name: Reset cached Android build tree
        run: rm -rf mobile_app/.buildozer

      - name: Build x86_64 debug APK
        working-directory: mobile_app
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euo pipefail
          sed -i 's/^android.archs = arm64-v8a$/android.archs = x86_64/' buildozer.spec
          grep '^android.archs' buildozer.spec
          buildozer -v android debug 2>&1 | tee ../buildozer-emulator.log

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: |
            set -uo pipefail
            APK=$(find mobile_app/bin -maxdepth 1 -name '*-x86_64-debug.apk' -type f | head -n 1)
            echo "apk=$APK"
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb install -r "$APK" 2>&1 | tee install.txt
            adb shell monkey -p com.electrocalc.app -c android.intent.category.LAUNCHER 1 2>&1 | tee launch.txt || true
            sleep 45
            adb shell pidof com.electrocalc.app | tr -d '\r' | tee pid.txt
            adb shell dumpsys activity activities > activities.txt 2>&1 || true
            adb logcat -d > logcat.txt 2>&1 || true
            adb exec-out screencap -p > emulator-startup.png || true
            ls -l emulator-startup.png 2>/dev/null || true
            test -s pid.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-evidence
          path: |
            emulator-startup.png
            install.txt
            launch.txt
            pid.txt
            activities.txt
            logcat.txt
            buildozer-emulator.log
            mobile_app/bin/*.apk
          if-no-files-found: warn
          retention-days: 7
