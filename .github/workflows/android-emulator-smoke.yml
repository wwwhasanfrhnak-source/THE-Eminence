name: Android Emulator Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "mobile_app/**"

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Install and launch on emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            libpulse0 libxcb1 libx11-6 libxkbcommon0 \
            git zip unzip openssl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Patch Buildozer manifest-argument quoting
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          import buildozer.targets.android as target

          path = Path(target.__file__)
          text = path.read_text(encoding="utf-8")
          text, escapes = re.subn(
              r"\.replace\('\"', '\\\\\"'\)", "", text
          )
          text, quoting = re.subn(
              r"--extra-manifest-application-arguments=\"\{\}\"",
              "--extra-manifest-application-arguments={}",
              text,
          )
          assert escapes == 1, f"quoting escape patch failed: {escapes}"
          assert quoting == 1, f"argument quoting patch failed: {quoting}"
          path.write_text(text, encoding="utf-8")
          print(f"patched {path}")
          PY

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile_app/.buildozer
          key: buildozer-smoke-${{ runner.os }}-p4a-v2024.01.21-v1-${{ hashFiles('mobile_app/buildozer.spec') }}
          restore-keys: |
            buildozer-smoke-${{ runner.os }}-p4a-v2024.01.21-v1-
            buildozer-${{ runner.os }}-p4a-v2024.01.21-v2-

      - name: Reset cached Android build tree
        run: rm -rf mobile_app/.buildozer

      - name: Build x86_64 release APK
        working-directory: mobile_app
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euo pipefail
          sed -i 's/^android.archs = arm64-v8a$/android.archs = x86_64/' buildozer.spec
          grep '^android.archs' buildozer.spec
          KEYSTORE="$RUNNER_TEMP/smoke.keystore"
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair \
            -keystore "$KEYSTORE" -storetype PKCS12 -alias smoke \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Smoke Test, OU=Mobile, O=ElectroCalc, C=IR"
          export P4A_RELEASE_KEYSTORE="$KEYSTORE"
          export P4A_RELEASE_KEYSTORE_PASSWD="$PASS"
          export P4A_RELEASE_KEYALIAS=smoke
          export P4A_RELEASE_KEYALIAS_PASSWD="$PASS"
          buildozer -v android release 2>&1 | tee ../buildozer-emulator.log

      - name: Install and launch on emulator
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -uxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          ADB="$SDK/platform-tools/adb"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"

          {
            echo "--- disk ---"; df -h / /home || true
            echo "--- kvm ---"; ls -l /dev/kvm || true
            echo "--- sdk ---"; ls "$SDK" || true
            echo "--- ndk size ---"; du -sh "$HOME"/.buildozer/android/platform/android-ndk-* 2>/dev/null || true
          } 2>&1 | tee environment.txt

          # Reclaim NDK space; the emulator build no longer needs it.
          rm -rf "$HOME"/.buildozer/android/platform/android-ndk-* || true

          curl -sSL --max-time 900 --retry 3 -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          ls -l /tmp/cmdline-tools.zip
          rm -rf /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK/cmdline-tools"
          mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$SDK/cmdline-tools/latest/bin/avdmanager"

          yes | timeout 600 "$SDKM" --sdk_root="$SDK" --licenses > licenses.txt 2>&1 || true
          set +e
          timeout 2400 "$SDKM" --sdk_root="$SDK" "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            2>&1 | tr '\r' '\n' | tail -n 60 | tee sdkmanager.txt
          SDKM_STATUS=${PIPESTATUS[0]}
          set -e
          echo "sdkmanager exit: $SDKM_STATUS" | tee -a sdkmanager.txt
          df -h /home | tee -a sdkmanager.txt

          echo no | timeout 600 "$AVDM" create avd -n smoke30 \
            -k "system-images;android-30;google_apis;x86_64" \
            -p "$ANDROID_AVD_HOME/smoke30.avd" --force \
            2>&1 | tee avdmanager.txt
          echo "avdmanager exit: ${PIPESTATUS[1]}" | tee -a avdmanager.txt
          ls -la "$ANDROID_AVD_HOME" | tee -a avdmanager.txt
          "$AVDM" list avd 2>&1 | tee -a avdmanager.txt || true
          if [ ! -f "$ANDROID_AVD_HOME/smoke30.ini" ]; then
            echo "smoke30.ini missing after create; searching" | tee -a avdmanager.txt
            find "$HOME" -maxdepth 6 -name 'smoke30*' 2>/dev/null | tee -a avdmanager.txt || true
          fi

          "$SDK/emulator/emulator" -avd smoke30 -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "emulator pid $EMULATOR_PID"
          "$ADB" start-server >/dev/null 2>&1 || true

          BOOTED=0
          for _ in $(seq 1 90); do
            STATE=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$STATE" = "1" ]; then BOOTED=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then echo "emulator exited early"; break; fi
            sleep 5
          done
          "$ADB" devices -l | tee devices.txt
          echo "booted=$BOOTED" | tee boot.txt
          "$ADB" shell input keyevent 82 >/dev/null 2>&1 || true

          APK=$(find mobile_app/bin -maxdepth 1 -name '*-release.apk' -type f | head -n 1)
          echo "apk=$APK" | tee apk.txt
          BT=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          echo "build-tools=$BT" | tee -a apk.txt
          "${BT}aapt" dump badging "$APK" 2>&1 | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee badging.txt
          if "${BT}aapt" dump badging "$APK" 2>&1 | grep -q "application-debuggable"; then
            echo "APK is debuggable"; exit 1
          fi
          "${BT}apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee signature.txt

          timeout 300 "$ADB" install -r "$APK" 2>&1 | tee install.txt || true
          "$ADB" shell svc wifi disable >/dev/null 2>&1 || true
          "$ADB" shell svc data disable >/dev/null 2>&1 || true
          timeout 120 "$ADB" shell am start -n com.electrocalc.app/org.kivy.android.PythonActivity 2>&1 | tee launch.txt || true
          sleep 15
          timeout 60 "$ADB" exec-out screencap -p > splash-check.png || true
          sleep 45
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid.txt || true
          "$ADB" shell dumpsys window windows 2>&1 | grep -E "mCurrentFocus|mFocusedApp" | tee focus.txt || true
          "$ADB" shell dumpsys activity activities > activities.txt 2>&1 || true
          "$ADB" shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          "$ADB" shell cat /sdcard/window.xml > window.xml 2>/dev/null || true
          timeout 60 "$ADB" exec-out screencap -p > emulator-startup.png || true

          timeout 60 "$ADB" shell am force-stop com.electrocalc.app >/dev/null 2>&1 || true
          sleep 3
          timeout 120 "$ADB" shell am start -n com.electrocalc.app/org.kivy.android.PythonActivity 2>&1 | tee relaunch.txt || true
          sleep 30
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid-relaunch.txt || true
          timeout 60 "$ADB" exec-out screencap -p > emulator-relaunch.png || true

          # ---------------- UI/db helpers ----------------
          shot() { timeout 60 "$ADB" exec-out screencap -p > "$1" || true; }
          tap() { "$ADB" shell input tap "$1" "$2" >/dev/null 2>&1 || true; sleep "${3:-1}"; }
          typ() { "$ADB" shell input text "$1" >/dev/null 2>&1 || true; sleep 1; }
          ime_off() { "$ADB" shell input keyevent 4 >/dev/null 2>&1 || true; sleep 1; }
          clear_field() {
            "$ADB" shell 'input keyevent 123; i=0; while [ $i -lt 24 ]; do input keyevent 67; i=$((i+1)); done' >/dev/null 2>&1 || true
            sleep 1
          }
          fill_field() { tap "$1" "$2" 1; clear_field; typ "$3"; ime_off; }
          pull_db() {
            "$ADB" shell cp /data/user/0/com.electrocalc.app/files/electrocalc.db /sdcard/"$1".db >/dev/null 2>&1 || true
            timeout 120 "$ADB" pull /sdcard/"$1".db "$1".db >/dev/null 2>&1 || true
            python3 db_state.py "$1.db" > "$1.json" 2>/dev/null || echo '{}' > "$1.json"
            echo "$1: $(cat "$1.json")" | tee -a db-timeline.txt
          }
          applog() { timeout 60 "$ADB" logcat -d -s python 2>/dev/null | grep -a "ElectroCalc:" || true; }
          log_has() { applog | grep -q -- "$1"; }
          json_get() { python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2],''))" "$1" "$2"; }

          cat > db_state.py <<'PY'
          import json, sqlite3, sys
          connection = sqlite3.connect(sys.argv[1])
          users = connection.execute("SELECT COUNT(*) FROM users").fetchone()[0]
          row = connection.execute(
              "SELECT username, password_hash, role, is_superadmin, active, "
              "account_status, platform_android FROM users ORDER BY id LIMIT 1"
          ).fetchone()
          flags = connection.execute(
              "SELECT COUNT(*) FROM app_settings WHERE key LIKE 'password_change_required:%'"
          ).fetchone()[0]
          connection.close()
          scheme = (
              "bcrypt" if row and str(row[1]).startswith(("$2a$", "$2b$", "$2y$"))
              else "other"
          )
          print(json.dumps({
              "users": users,
              "username": row[0] if row else "",
              "hash": row[1] if row else "",
              "role": row[2] if row else "",
              "superadmin": row[3] if row else None,
              "active": row[4] if row else None,
              "status": row[5] if row else "",
              "android": row[6] if row else None,
              "scheme": scheme,
              "flags": flags,
          }, ensure_ascii=False))
          PY

          SMOKE_USER=smokeadmin
          SMOKE_PASS=$(openssl rand -hex 8)
          NEW_PASS=$(openssl rand -hex 9)
          export SMOKE_PASS NEW_PASS
          echo "::add-mask::$SMOKE_PASS"
          echo "::add-mask::$NEW_PASS"

          "$ADB" root >/dev/null 2>&1 || true
          sleep 5
          "$ADB" logcat -c >/dev/null 2>&1 || true

          # ---- phase 0: fresh device database ----
          pull_db db-initial
          python3 - <<'PY'
          import json
          state = json.load(open("db-initial.json"))
          assert state["users"] == 0, state
          print("phase0 ok: fresh database has no accounts")
          PY

          # ---- phase 1: first-run admin setup ----
          tap 160 330 1
          typ "$SMOKE_USER"
          ime_off
          tap 160 400 1
          typ "$SMOKE_PASS"
          ime_off
          shot setup-filled.png
          SETUP_OK=0
          for coords in "160 585" "160 600" "160 570"; do
            set -- $coords
            tap "$1" "$2" 2
            sleep 12
            pull_db db-bootstrap
            if [ "$(json_get db-bootstrap.json users)" = "1" ]; then SETUP_OK=1; break; fi
          done
          shot change-dialog.png
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid-after-setup.txt || true
          [ "$SETUP_OK" = "1" ] || { echo "admin creation did not save"; exit 1; }
          python3 - <<'PY'
          import json
          state = json.load(open("db-bootstrap.json"))
          assert state["users"] == 1, state
          assert state["username"], state
          assert state["role"] == "admin", state
          assert state["scheme"] == "bcrypt", state
          assert state["superadmin"] == 1 and state["active"] == 1, state
          assert state["status"] == "active" and state["android"] == 1, state
          assert state["flags"] == 1, state
          print("phase1 ok: one hashed superadmin with forced change flag")
          PY
          log_has "bootstrap=created" || { echo "bootstrap event missing from log"; exit 1; }

          # ---- phase 2: forced password change ----
          tap 160 300 1
          typ "$NEW_PASS"
          ime_off
          tap 160 370 1
          typ "$NEW_PASS"
          ime_off
          shot change-form-filled.png
          CHANGED=0
          for coords in "240 460" "200 462" "265 462" "160 460"; do
            set -- $coords
            tap "$1" "$2" 2
            sleep 10
            pull_db db-changed
            if [ "$(json_get db-changed.json flags)" = "0" ]; then CHANGED=1; break; fi
          done
          shot dashboard.png
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid-after-change.txt || true
          [ "$CHANGED" = "1" ] || { echo "forced password change did not complete"; applog | tail -n 20; exit 1; }
          python3 - <<'PY'
          import json, os
          state = json.load(open("db-changed.json"))
          assert state["users"] == 1, state
          assert state["scheme"] == "bcrypt", state
          assert state["flags"] == 0, state
          assert state["hash"] != os.environ["NEW_PASS"], "hash equals plaintext"
          assert state["hash"] != os.environ["SMOKE_PASS"], "hash equals old plaintext"
          print("phase2 ok: password replaced by new bcrypt hash, flag cleared")
          PY
          log_has "password_changed" || { echo "password_changed event missing"; exit 1; }
          log_has "screen=dashboard" || { echo "dashboard event missing"; exit 1; }

          # ---- phase 3: dashboard scroll ----
          "$ADB" shell input swipe 160 520 160 220 500 >/dev/null 2>&1 || true
          sleep 2
          shot dashboard-scrolled.png
          "$ADB" shell input swipe 160 220 160 520 500 >/dev/null 2>&1 || true
          sleep 2

          # ---- phase 4: logout ----
          LOGGED_OUT=0
          for coords in "288 37" "292 40" "296 37" "283 40" "240 37"; do
            set -- $coords
            tap "$1" "$2" 3
            if log_has "action=logout"; then LOGGED_OUT=1; break; fi
          done
          shot logout-login.png
          [ "$LOGGED_OUT" = "1" ] || { echo "logout action not reached"; exit 1; }

          # ---- phase 5: old temporary password must be refused ----
          fill_field 160 330 "$SMOKE_USER"
          fill_field 160 400 "$SMOKE_PASS"
          shot login-old-filled.png
          tap 160 585 2
          sleep 10
          shot login-old-rejected.png
          pull_db db-old-rejected
          log_has "login=denied" || { echo "old password was not rejected"; exit 1; }
          python3 - <<'PY'
          import json
          before = json.load(open("db-changed.json"))
          after = json.load(open("db-old-rejected.json"))
          assert after["users"] == 1, after
          assert after["hash"] == before["hash"], "hash changed during rejected login"
          print("phase5 ok: rejected login left the database untouched")
          PY

          # ---- phase 6: login with the new password ----
          fill_field 160 400 "$NEW_PASS"
          tap 160 585 2
          sleep 12
          shot dashboard-relogin.png
          DASH_COUNT=$(applog | grep -c "screen=dashboard" || true)
          echo "dashboard events after relogin: $DASH_COUNT"
          [ "$DASH_COUNT" -ge 2 ] || { echo "relogin did not reach dashboard"; exit 1; }
          log_has "login=ok" || { echo "successful login event missing"; exit 1; }

          # ---- phase 7: restart and persistence ----
          "$ADB" shell am force-stop com.electrocalc.app >/dev/null 2>&1 || true
          sleep 3
          timeout 120 "$ADB" shell am start -n com.electrocalc.app/org.kivy.android.PythonActivity >> relaunch.txt 2>&1 || true
          for _ in $(seq 1 12); do
            log_has "app_start" && break
            sleep 5
          done
          sleep 8
          shot restart-login.png
          fill_field 160 330 "$SMOKE_USER"
          fill_field 160 400 "$NEW_PASS"
          tap 160 585 2
          sleep 12
          shot dashboard-restart.png
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid-final.txt || true
          pull_db db-final
          PID_BEFORE=$(tr -d '\r\n' < pid-after-change.txt || true)
          PID_AFTER=$(tr -d '\r\n' < pid-final.txt || true)
          echo "pids before=$PID_BEFORE after=$PID_AFTER"
          [ -n "$PID_BEFORE" ] && [ -n "$PID_AFTER" ] && [ "$PID_BEFORE" != "$PID_AFTER" ] || { echo "app did not restart"; exit 1; }
          DASH_COUNT=$(applog | grep -c "screen=dashboard" || true)
          echo "dashboard events after restart: $DASH_COUNT"
          [ "$DASH_COUNT" -ge 3 ] || { echo "restart login did not reach dashboard"; exit 1; }
          python3 - <<'PY'
          import json, os
          changed = json.load(open("db-changed.json"))
          final = json.load(open("db-final.json"))
          assert final["users"] == 1, final
          assert final["scheme"] == "bcrypt", final
          assert final["flags"] == 0, final
          assert final["hash"] == changed["hash"], "hash changed across restart"
          for secret in (os.environ.get("SMOKE_PASS", ""), os.environ.get("NEW_PASS", "")):
              assert secret and secret not in final["hash"], "plaintext password stored"
          print("phase7 ok: single admin persisted across restart, hashed, flag cleared")
          PY

          # ---- phase 8: ordered log evidence ----
          applog > app-log.txt
          grep -c "ElectroCalc:" app-log.txt | tee log-events.txt || true
          python3 - <<'PY'
          lines = open("app-log.txt", encoding="utf-8", errors="replace").read().splitlines()
          def first(needle):
              for index, line in enumerate(lines):
                  if needle in line:
                      return index
              raise AssertionError(f"missing log event: {needle}")
          order = [
              "bootstrap=created",
              "password_change_required",
              "password_changed",
              "screen=dashboard",
              "action=logout",
              "login=denied",
              "login=ok",
              "app_start",
          ]
          positions = [first(needle) for needle in order]
          assert positions == sorted(positions), f"unexpected event order: {positions}"
          print("phase8 ok: ordered auth events present")
          PY

          timeout 300 "$ADB" logcat -d > logcat.txt 2>&1 || true
          timeout 120 "$ADB" logcat -d -b crash > logcat-crash.txt 2>&1 || true
          ls -l dashboard.png dashboard-relogin.png dashboard-restart.png login-old-rejected.png 2>/dev/null || true
          test -s pid.txt
          test -s pid-final.txt

      - name: Publish diagnostics
        if: always()
        run: |
          {
            echo "## Emulator diagnostics"
            for f in environment.txt boot.txt apk.txt devices.txt badging.txt signature.txt avdmanager.txt install.txt launch.txt pid.txt focus.txt relaunch.txt pid-relaunch.txt; do
              if [ -f "$f" ]; then echo "### $f"; echo '```'; tail -n 40 "$f"; echo '```'; fi
            done
            if [ -f sdkmanager.txt ]; then echo "### sdkmanager.txt"; echo '```'; tail -n 25 sdkmanager.txt; echo '```'; fi
            if [ -f db-timeline.txt ]; then echo "### db-timeline.txt"; echo '```'; tail -n 20 db-timeline.txt; echo '```'; fi
            if [ -f app-log.txt ]; then echo "### app-log.txt"; echo '```'; tail -n 60 app-log.txt; echo '```'; fi
            if [ -f emulator.log ]; then echo "### emulator.log"; echo '```'; tail -n 40 emulator.log; echo '```'; fi
            if [ -f logcat.txt ]; then
              echo "### logcat relevant lines"
              echo '```'
              grep -aE "python|SDL|Kivy|FATAL|AndroidRuntime|Traceback|Exception|Error|electrocalc" logcat.txt | head -n 250 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-evidence
          path: |
            environment.txt
            devices.txt
            boot.txt
            apk.txt
            licenses.txt
            sdkmanager.txt
            avdmanager.txt
            emulator.log
            emulator-startup.png
            splash-check.png
            emulator-relaunch.png
            setup-filled.png
            change-dialog.png
            change-form-filled.png
            dashboard.png
            dashboard-scrolled.png
            logout-login.png
            login-old-filled.png
            login-old-rejected.png
            dashboard-relogin.png
            restart-login.png
            dashboard-restart.png
            focus.txt
            relaunch.txt
            pid-relaunch.txt
            pid-after-setup.txt
            pid-after-change.txt
            pid-final.txt
            db-timeline.txt
            db-initial.json
            db-bootstrap.json
            db-changed.json
            db-old-rejected.json
            db-final.json
            app-log.txt
            log-events.txt
            window.xml
            badging.txt
            signature.txt
            install.txt
            launch.txt
            pid.txt
            activities.txt
            logcat.txt
            logcat-crash.txt
            buildozer-emulator.log
          if-no-files-found: warn
          retention-days: 7
