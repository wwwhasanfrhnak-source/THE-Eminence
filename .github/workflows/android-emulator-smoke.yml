name: Android Emulator Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "mobile_app/**"

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Install and launch on emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev \
            libpulse0 libxcb1 libx11-6 libxkbcommon0 \
            git zip unzip openssl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Patch Buildozer manifest-argument quoting
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          import buildozer.targets.android as target

          path = Path(target.__file__)
          text = path.read_text(encoding="utf-8")
          text, escapes = re.subn(
              r"\.replace\('\"', '\\\\\"'\)", "", text
          )
          text, quoting = re.subn(
              r"--extra-manifest-application-arguments=\"\{\}\"",
              "--extra-manifest-application-arguments={}",
              text,
          )
          assert escapes == 1, f"quoting escape patch failed: {escapes}"
          assert quoting == 1, f"argument quoting patch failed: {quoting}"
          path.write_text(text, encoding="utf-8")
          print(f"patched {path}")
          PY

      - name: Cache Buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            mobile_app/.buildozer
          key: buildozer-smoke-${{ runner.os }}-p4a-v2024.01.21-v1-${{ hashFiles('mobile_app/buildozer.spec') }}
          restore-keys: |
            buildozer-smoke-${{ runner.os }}-p4a-v2024.01.21-v1-
            buildozer-${{ runner.os }}-p4a-v2024.01.21-v2-

      - name: Reset cached Android build tree
        run: rm -rf mobile_app/.buildozer

      - name: Build x86_64 release APK
        working-directory: mobile_app
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euo pipefail
          sed -i 's/^android.archs = arm64-v8a$/android.archs = x86_64/' buildozer.spec
          grep '^android.archs' buildozer.spec
          KEYSTORE="$RUNNER_TEMP/smoke.keystore"
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair \
            -keystore "$KEYSTORE" -storetype PKCS12 -alias smoke \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Smoke Test, OU=Mobile, O=ElectroCalc, C=IR"
          export P4A_RELEASE_KEYSTORE="$KEYSTORE"
          export P4A_RELEASE_KEYSTORE_PASSWD="$PASS"
          export P4A_RELEASE_KEYALIAS=smoke
          export P4A_RELEASE_KEYALIAS_PASSWD="$PASS"
          buildozer -v android release 2>&1 | tee ../buildozer-emulator.log

      - name: Install and launch on emulator
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          set -uxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          ADB="$SDK/platform-tools/adb"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"

          {
            echo "--- disk ---"; df -h / /home || true
            echo "--- kvm ---"; ls -l /dev/kvm || true
            echo "--- sdk ---"; ls "$SDK" || true
            echo "--- ndk size ---"; du -sh "$HOME"/.buildozer/android/platform/android-ndk-* 2>/dev/null || true
          } 2>&1 | tee environment.txt

          # Reclaim NDK space; the emulator build no longer needs it.
          rm -rf "$HOME"/.buildozer/android/platform/android-ndk-* || true

          curl -sSL --max-time 900 --retry 3 -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          ls -l /tmp/cmdline-tools.zip
          rm -rf /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mkdir -p "$SDK/cmdline-tools"
          mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$SDK/cmdline-tools/latest/bin/avdmanager"

          yes | timeout 600 "$SDKM" --sdk_root="$SDK" --licenses > licenses.txt 2>&1 || true
          set +e
          timeout 2400 "$SDKM" --sdk_root="$SDK" "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            2>&1 | tr '\r' '\n' | tail -n 60 | tee sdkmanager.txt
          SDKM_STATUS=${PIPESTATUS[0]}
          set -e
          echo "sdkmanager exit: $SDKM_STATUS" | tee -a sdkmanager.txt
          df -h /home | tee -a sdkmanager.txt

          echo no | timeout 600 "$AVDM" create avd -n smoke30 \
            -k "system-images;android-30;google_apis;x86_64" \
            -p "$ANDROID_AVD_HOME/smoke30.avd" --force \
            2>&1 | tee avdmanager.txt
          echo "avdmanager exit: ${PIPESTATUS[1]}" | tee -a avdmanager.txt
          ls -la "$ANDROID_AVD_HOME" | tee -a avdmanager.txt
          "$AVDM" list avd 2>&1 | tee -a avdmanager.txt || true
          if [ ! -f "$ANDROID_AVD_HOME/smoke30.ini" ]; then
            echo "smoke30.ini missing after create; searching" | tee -a avdmanager.txt
            find "$HOME" -maxdepth 6 -name 'smoke30*' 2>/dev/null | tee -a avdmanager.txt || true
          fi

          "$SDK/emulator/emulator" -avd smoke30 -no-window -gpu swiftshader_indirect \
            -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics \
            > emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "emulator pid $EMULATOR_PID"
          "$ADB" start-server >/dev/null 2>&1 || true

          BOOTED=0
          for _ in $(seq 1 90); do
            STATE=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$STATE" = "1" ]; then BOOTED=1; break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then echo "emulator exited early"; break; fi
            sleep 5
          done
          "$ADB" devices -l | tee devices.txt
          echo "booted=$BOOTED" | tee boot.txt
          "$ADB" shell input keyevent 82 >/dev/null 2>&1 || true

          APK=$(find mobile_app/bin -maxdepth 1 -name '*-release.apk' -type f | head -n 1)
          echo "apk=$APK" | tee apk.txt
          BT=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          echo "build-tools=$BT" | tee -a apk.txt
          "${BT}aapt" dump badging "$APK" 2>&1 | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" | tee badging.txt
          if "${BT}aapt" dump badging "$APK" 2>&1 | grep -q "application-debuggable"; then
            echo "APK is debuggable"; exit 1
          fi
          "${BT}apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee signature.txt

          timeout 300 "$ADB" install -r "$APK" 2>&1 | tee install.txt || true
          "$ADB" shell svc wifi disable >/dev/null 2>&1 || true
          "$ADB" shell svc data disable >/dev/null 2>&1 || true
          timeout 120 "$ADB" shell am start -n com.electrocalc.app/org.kivy.android.PythonActivity 2>&1 | tee launch.txt || true
          sleep 15
          timeout 60 "$ADB" exec-out screencap -p > splash-check.png || true
          sleep 45
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid.txt || true
          "$ADB" shell dumpsys window windows 2>&1 | grep -E "mCurrentFocus|mFocusedApp" | tee focus.txt || true
          "$ADB" shell dumpsys activity activities > activities.txt 2>&1 || true
          "$ADB" shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          "$ADB" shell cat /sdcard/window.xml > window.xml 2>/dev/null || true
          timeout 60 "$ADB" exec-out screencap -p > emulator-startup.png || true

          timeout 60 "$ADB" shell am force-stop com.electrocalc.app >/dev/null 2>&1 || true
          sleep 3
          timeout 120 "$ADB" shell am start -n com.electrocalc.app/org.kivy.android.PythonActivity 2>&1 | tee relaunch.txt || true
          sleep 30
          "$ADB" shell pidof com.electrocalc.app | tr -d '\r' | tee pid-relaunch.txt || true
          timeout 60 "$ADB" exec-out screencap -p > emulator-relaunch.png || true

          # Drive the login form once: empty DB means local auth must reject
          # this attempt without blocking the UI thread.
          "$ADB" shell input tap 160 330 >/dev/null 2>&1 || true
          sleep 1
          "$ADB" shell input text "admin" >/dev/null 2>&1 || true
          "$ADB" shell input keyevent 4 >/dev/null 2>&1 || true
          sleep 1
          "$ADB" shell input tap 160 400 >/dev/null 2>&1 || true
          sleep 1
          "$ADB" shell input text "invalid-pass" >/dev/null 2>&1 || true
          "$ADB" shell input keyevent 4 >/dev/null 2>&1 || true
          sleep 2
          timeout 60 "$ADB" exec-out screencap -p > login-filled.png || true
          "$ADB" shell input tap 160 585 >/dev/null 2>&1 || true
          sleep 8
          timeout 60 "$ADB" exec-out screencap -p > login-attempt.png || true

          timeout 300 "$ADB" logcat -d > logcat.txt 2>&1 || true
          timeout 120 "$ADB" logcat -d -b crash > logcat-crash.txt 2>&1 || true
          ls -l emulator-startup.png emulator-relaunch.png login-attempt.png 2>/dev/null || true
          test -s pid.txt

      - name: Publish diagnostics
        if: always()
        run: |
          {
            echo "## Emulator diagnostics"
            for f in environment.txt boot.txt apk.txt devices.txt badging.txt signature.txt avdmanager.txt install.txt launch.txt pid.txt focus.txt relaunch.txt pid-relaunch.txt; do
              if [ -f "$f" ]; then echo "### $f"; echo '```'; tail -n 40 "$f"; echo '```'; fi
            done
            if [ -f sdkmanager.txt ]; then echo "### sdkmanager.txt"; echo '```'; tail -n 25 sdkmanager.txt; echo '```'; fi
            if [ -f emulator.log ]; then echo "### emulator.log"; echo '```'; tail -n 40 emulator.log; echo '```'; fi
            if [ -f logcat.txt ]; then
              echo "### logcat relevant lines"
              echo '```'
              grep -aE "python|SDL|Kivy|FATAL|AndroidRuntime|Traceback|Exception|Error|electrocalc" logcat.txt | head -n 250 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-evidence
          path: |
            environment.txt
            devices.txt
            boot.txt
            apk.txt
            licenses.txt
            sdkmanager.txt
            avdmanager.txt
            emulator.log
            emulator-startup.png
            splash-check.png
            emulator-relaunch.png
            login-attempt.png
            login-filled.png
            focus.txt
            relaunch.txt
            pid-relaunch.txt
            window.xml
            badging.txt
            signature.txt
            install.txt
            launch.txt
            pid.txt
            activities.txt
            logcat.txt
            logcat-crash.txt
            buildozer-emulator.log
          if-no-files-found: warn
          retention-days: 7
